# Include from nginx's http context. Replace paper.example.com and certificate paths.
limit_req_zone $binary_remote_addr zone=paper_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=paper_connections:10m;
server {
    listen 80;
    server_name paper.example.com;
    return 301 https://paper.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name paper.example.com;
    ssl_certificate /etc/letsencrypt/live/paper.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paper.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 51m;
    client_body_timeout 30s;
    limit_req zone=paper_requests burst=30 nodelay;
    limit_conn paper_connections 20;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite forwarded addresses; never trust a caller-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 650s;
    }
}
